<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Ad&bull;Bundance &middot; Client Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* ===========================================================================
   The CLIENT side of the OS. One client, signed in, seeing only their own
   work. Same Material tokens and shell as 20-internal.html on purpose: the
   two products are the same system seen from opposite ends of the handoff.

   THE MODEL (Carl, 2026-08-31): a batch is not a flow to read, it is a set of
   WINDOWS - Concepts, Scripts, Talent, Videos, Statics - one per deliverable
   the client requested for that batch. A window is LOCKED while the studio
   holds that step, becomes NEEDS-YOU when the internal side pushes it to the
   client, and turns DONE once the client signs it off. The internal board
   already knows when each step is ready; this page just mirrors the push.
   Only the client's acceptance advances the batch - same rule as internal.
   =========================================================================== */
:root{
  --bg:#F0F4F9; --surface:#fff; --rail:#E9EEF6;
  --line:#DADCE0; --line-strong:#C4C7C5; --hair:#E8EAED; --fill:#F1F3F4;
  --ink:#202124; --ink-2:#444746; --ink-3:#5F6368; --ink-4:#80868B; --ink-5:#9AA0A6;

  --accent:#0B57D0; --accent-tint:#D3E3FD; --accent-soft:#E8F0FE; --accent-deep:#041E49;
  --green:#188038; --green-tint:#E6F4EA; --green-line:#A8DAB5; --green-deep:#0D652D;
  --amber:#B06000; --amber-tint:#FEF7E0; --amber-line:#FDE293; --amber-deep:#8A4600;
  --red:#C5221F; --red-tint:#FCE8E6; --red-line:#F6AEA9; --red-deep:#A50E0E;
  --violet:#9334E6; --violet-tint:#F3E8FD; --violet-line:#E0C6F7; --violet-deep:#6B21A8;
  --blue:#1967D2;

  --font:'Poppins',system-ui,sans-serif;
  --mono:'Roboto Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  letter-spacing:-.011em;-webkit-font-smoothing:antialiased;overflow:hidden;display:flex}
::selection{background:rgba(11,87,208,.16)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.13);border-radius:28px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;font-family:inherit}
:is(a,button,select,input):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- primitives (verbatim from the internal file) ---------- */
.mono{font-family:var(--mono)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.amber{color:var(--amber);background:var(--amber-tint);border:1px solid var(--amber-line)}
.pill.green{color:var(--green);background:var(--green-tint);border:1px solid var(--green-line)}
.pill.blue{color:var(--blue);background:var(--accent-soft);border:1px solid #A8C7FA}
.pill.grey{color:var(--ink-3);background:var(--fill);border:1px solid var(--line)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.live{animation:pulse 2.2s infinite}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 1px 2px rgba(60,64,67,.08)}
.btn{height:40px;padding:0 18px;border-radius:999px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:transform .15s,background .15s,border-color .15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-2)}
.btn.ghost:hover{background:var(--fill)}
.btn.sm{height:34px;padding:0 14px;font-size:12.5px}
.btn[disabled]{background:var(--hair);color:var(--ink-5);cursor:not-allowed;transform:none}
.kicker{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-5);font-weight:600}
h1.page{font-size:25px;font-weight:600;letter-spacing:-.028em;margin-bottom:5px}
p.lede{font-size:14px;color:var(--ink-2)}
.sechead{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.sechead b{font-size:13px;font-weight:600}
.sechead .sp{flex:1}
.sechead a{font-size:12.5px;color:var(--accent);font-weight:600;cursor:pointer}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);
  width:100%;text-align:left;transition:border-color .14s,box-shadow .14s;box-shadow:0 1px 2px rgba(60,64,67,.08)}
button.row:hover{border-color:#A8C7FA}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .main b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main i{font-style:normal;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tint{width:38px;height:38px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center}
.av{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.av.s{width:24px;height:24px;font-size:9.5px}
.av.l{width:34px;height:34px;font-size:12.5px}

/* ---------- shell ---------- */
aside{width:236px;flex:none;height:100vh;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:7px 9px;margin:14px 14px 10px;border-radius:16px}
.mark{width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#6B47FF,#A78BFA);font-weight:800;font-size:11.5px;color:#fff}
.brand b{display:block;font-size:11.5px;font-weight:600;letter-spacing:-.015em;white-space:nowrap}
.brand i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3)}
.cta{margin:0 14px 12px;height:40px;border-radius:16px;background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .15s}
.cta:hover{transform:translateY(-1px)}
nav{flex:1;overflow-y:auto;padding:0 10px 16px}
.group{margin-bottom:12px}
.group .kicker{padding:8px 11px 5px;display:block}
.nav{display:flex;align-items:center;gap:11px;width:100%;height:40px;padding:0 14px;border-radius:999px;margin:1px 0;
  color:var(--ink-2);font-size:13px;font-weight:500;transition:background .14s,color .14s;text-align:left}
.nav:hover{background:#DFE6F0}
.nav svg{flex:none;stroke:var(--ink-4)}
.nav span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink-4);flex:none}
.nav.on{background:var(--accent-tint);color:var(--accent-deep);font-weight:600}
.nav.on svg{stroke:var(--accent)}
.nav.on em{color:var(--accent)}
.foot{padding:11px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.who{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:14px;width:100%;text-align:left}
.who b{display:block;font-size:12px;font-weight:600}
.who i{display:block;font-style:normal;font-size:10px;color:var(--ink-3)}
main{flex:1;min-width:0;height:100vh;display:flex;flex-direction:column}
.chrome{flex:none;height:56px;padding:0 24px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.55)}
.back{width:30px;height:30px;border-radius:12px;background:var(--surface);border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;flex:none;transition:border-color .15s}
.back:hover{border-color:var(--accent)}
.back[hidden]{display:none}
.chrome .t{min-width:0}
.chrome .t b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap}
.chrome .t i{display:block;font-style:normal;font-size:11px;color:var(--ink-3);white-space:nowrap}
.msg{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);flex:none;transition:border-color .15s}
.msg:hover{border-color:#A8C7FA}
.msg span{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
#view{flex:1;display:flex;flex-direction:column;min-height:0}
.wrap{max-width:1000px;margin:0 auto;padding:26px 28px 44px;animation:in .35s ease;width:100%}

/* ---------- home callout ---------- */
.callout{display:inline-flex;align-items:center;gap:10px;padding:8px 15px 8px 9px;
  border:1px solid var(--amber-line);background:var(--amber-tint);border-radius:999px;
  font:inherit;font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.callout:hover{border-color:var(--amber)}
.callout .pill{flex:none}

/* ---------- batch windows ---------- */
/* The chips are the whole navigation of a batch: one per deliverable the
   client requested, each carrying its own state so the client can see the
   entire batch's health without opening anything. */
.wtabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 16px}
.wtab{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line-strong);font-size:13px;font-weight:600;color:var(--ink-2);
  transition:border-color .14s,background .14s}
.wtab:hover{border-color:#A8C7FA}
.wtab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.wtab .st{width:8px;height:8px;border-radius:50%;flex:none}
.wtab .st.done{background:var(--green)}
.wtab .st.you{background:var(--amber);animation:pulse 2.2s infinite}
.wtab .st.locked{background:var(--line-strong)}
.wtab.on .st.done{background:#8CE0AC}
.wtab.on .st.you{background:#FFD97A}
.wtab.on .st.locked{background:rgba(255,255,255,.5)}

.win{animation:in .25s ease}
.lockcard{padding:22px 24px;border-radius:20px;background:var(--surface);border:1px dashed var(--line-strong);
  display:flex;gap:16px;align-items:flex-start}
.lockcard .tint{background:var(--fill)}
.lockcard b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.lockcard p{font-size:13px;color:var(--ink-3);max-width:64ch}
.donebar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;
  background:var(--green-tint);border:1px solid var(--green-line);margin-bottom:12px;font-size:13px;color:var(--green-deep);font-weight:600}

/* concepts + scripts to review */
.cpt{padding:16px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;gap:14px}
.cpt.ok{border-color:var(--green-line);background:var(--green-tint)}
.cpt .main{flex:1;min-width:0}
.cpt .main b{display:block;font-size:13.5px;font-weight:600;margin-bottom:3px}
.cpt .main p{font-size:12.5px;color:var(--ink-2);max-width:70ch}
.cpt .main .hook{font-size:12px;color:var(--ink-3);font-style:italic;margin-top:5px}
.cpt .acts{display:flex;flex-direction:column;gap:7px;flex:none;align-items:flex-end}
.notebox{width:100%;margin-top:10px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);font-size:12.5px;resize:vertical;min-height:38px;background:var(--bg)}
.sendbar{display:flex;align-items:center;gap:12px;margin-top:16px}
.sendbar span{font-size:12px;color:var(--ink-3)}

/* talent shortlist */
.tal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.talc{border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:16px;text-align:left;
  display:flex;flex-direction:column;gap:9px;transition:border-color .14s}
.talc:hover{border-color:#A8C7FA}
.talc.pick{border-color:var(--green-line);background:var(--green-tint)}
.talc .av.xl{width:52px;height:52px;font-size:17px}
.talc b{font-size:13.5px;font-weight:600}
.talc i{font-style:normal;font-size:11.5px;color:var(--ink-3)}

/* ads grid */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ad{border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);text-align:left;
  transition:border-color .14s;display:flex;flex-direction:column}
.ad:hover{border-color:#A8C7FA}
.ad .th{aspect-ratio:9/13;display:flex;align-items:flex-end;padding:12px;position:relative}
.ad .th .fmt{position:absolute;top:10px;left:10px}
.ad .th b{color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.45);line-height:1.3}
.ad .ft{padding:10px 13px;display:flex;align-items:center;gap:8px}
.ad .ft i{font-style:normal;font-size:11px;color:var(--ink-3);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- the concept slide, verbatim idiom from the internal board ------ */
.board{display:grid;grid-template-columns:212px minmax(0,1fr) 250px;background:var(--surface);
  border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 2px 8px rgba(60,64,67,.08)}
@media (max-width:960px){.board{grid-template-columns:200px minmax(0,1fr)}.bmock{display:none}}
@media (max-width:720px){.board{grid-template-columns:1fr}.brail{display:none}}
.brail{border-right:1px solid var(--hair);background:#F8FAFD;padding:16px 12px;display:flex;flex-direction:column;min-width:0}
.blist{overflow-y:auto;max-height:560px;display:flex;flex-direction:column;gap:2px}
.bitem{display:flex;gap:9px;align-items:flex-start;width:100%;padding:8px 10px;border-radius:12px;
  font-size:12.5px;line-height:1.35;color:var(--ink-2);text-align:left}
.bitem:hover{background:#EDF1F8}
.bitem.on{background:var(--accent-tint);color:var(--accent-deep);font-weight:600}
.bnum{font-family:var(--mono);font-size:10px;color:var(--ink-5);flex:none;width:15px;padding-top:2px}
.bitem.on .bnum{color:var(--accent)}
.bitem .tick{margin-left:auto;flex:none;padding-top:2px}
.bdoc{padding:24px 28px 18px;min-width:0;display:flex;flex-direction:column}
.blab{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);font-weight:600;margin:18px 0 7px}
.btitle{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.15;margin:4px 0 10px}
.bp{font-size:13.5px;color:var(--ink-2);line-height:1.65}
.bdash{display:flex;gap:10px;margin-bottom:6px}
.bdash>span{color:var(--ink-4);flex:none;line-height:1.6}
.bdash p{flex:1;min-width:0;font-size:13px;color:var(--ink-2);line-height:1.6}
.bfoot{flex:none;display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--hair);padding-top:12px;margin-top:16px}
.bmock{border-left:1px solid var(--hair);background:#F8FAFD;padding:22px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.phone{width:100%;max-width:214px;border-radius:20px;overflow:hidden;background:#141416;box-shadow:0 10px 28px rgba(0,0,0,.18)}
.phead{display:flex;align-items:center;gap:9px;padding:11px 13px}
.phead b{display:block;font-size:12px;color:#fff;font-weight:600}
.phead i{display:block;font-style:normal;font-size:9.5px;color:rgba(255,255,255,.55)}
.pbody{min-height:264px;padding:18px 16px 14px;display:flex;flex-direction:column}
.pbody>b{font-size:17px;line-height:1.2;color:#fff;font-weight:700;letter-spacing:-.015em}
.pbody>p{font-size:12px;color:rgba(255,255,255,.92);margin-top:6px;line-height:1.45}
.mtag{font-family:var(--mono);font-size:9.5px;color:#fff;background:rgba(0,0,0,.26);border-radius:6px;padding:4px 9px;white-space:nowrap;align-self:flex-start;margin-top:auto}
.navbtn{width:34px;height:34px;border-radius:14px;background:var(--surface);border:1px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;flex:none;transition:border-color .15s}
.navbtn:hover{border-color:var(--accent)}
.navbtn[disabled]{opacity:.4;cursor:not-allowed}

/* ---------- the script doc, verbatim idiom from the internal scripts tool -- */
.docgrid{display:grid;grid-template-columns:218px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.docgrid{grid-template-columns:1fr}}
.dritem{display:flex;align-items:center;gap:9px;width:100%;min-height:34px;padding:6px 12px;border-radius:999px;
  font-size:12.5px;color:var(--ink-2);text-align:left;transition:background .14s}
.dritem:hover{background:#E4E9F2}
.dritem.on{background:var(--accent-tint);color:var(--accent-deep);font-weight:600}
.dritem span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paper{max-width:768px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:4px;
  box-shadow:0 1px 3px rgba(60,64,67,.15);padding:clamp(28px,5vw,52px) clamp(24px,6vw,60px) 52px}
.hooklab{font-size:14.5px;font-weight:700;margin:0 0 2px}
.pline{font-size:14.5px;line-height:1.75;color:var(--ink)}
.dirline{font-size:12px;color:var(--ink-4);font-style:italic;line-height:1.5;margin-top:2px}

/* ---------- full-page views, the internal's own boardwrap/scriptwrap ------ */
.wrap.boardwrap{max-width:none;width:100%;flex:1 1 0;min-height:0;margin:0;display:flex;flex-direction:column;padding:12px 22px 14px;animation:in .35s ease}
.boardwrap .board{flex:1;min-height:0;grid-template-columns:196px minmax(0,1fr) 392px}
.boardwrap .brail{min-height:0}
.boardwrap .blist{max-height:none;flex:1}
.boardwrap .bdoc{display:flex;flex-direction:column;padding:13px 24px 10px;min-width:0;min-height:0}
.boardwrap .bmock{padding:14px 14px 10px;justify-content:center;min-height:0}
.boardwrap .phone{max-width:358px;aspect-ratio:9/16.4;display:flex;flex-direction:column}
.boardwrap .pbody{flex:1;min-height:0}
.bscroll{flex:1;min-height:0;overflow-y:auto;padding-right:10px}
.bscroll>*{max-width:940px}
.bscroll .btitle{font-size:29px;margin:4px 0 11px}
.bscroll .blab{margin:16px 0 6px;font-size:10.5px}
.bscroll .bp{font-size:15px;line-height:1.66}
.bscroll .bdash{margin-bottom:5px}
.bscroll .bdash p{font-size:14.5px;line-height:1.58}
.bscroll.mid .btitle{font-size:26px;margin:3px 0 9px}
.bscroll.mid .blab{margin:12px 0 5px}
.bscroll.mid .bp{font-size:14px;line-height:1.58}
.bscroll.mid .bdash{margin-bottom:3px}
.bscroll.mid .bdash p{font-size:13.5px;line-height:1.5}
.bscroll.tight .btitle{font-size:23px;margin:2px 0 7px}
.bscroll.tight .blab{margin:9px 0 4px;font-size:10px}
.bscroll.tight .bp{font-size:13px;line-height:1.5}
.bscroll.tight .bdash{margin-bottom:2px}
.bscroll.tight .bdash p{font-size:12.5px;line-height:1.44}
.bscroll.xtight .btitle{font-size:18.5px;margin:0 0 5px}
.bscroll.xtight .blab{margin:6px 0 2px;font-size:9px}
.bscroll.xtight .bp{font-size:11.5px;line-height:1.4}
.bscroll.xtight .bdash{margin-bottom:0}
.bscroll.xtight .bdash p{font-size:11px;line-height:1.32}
@media (max-width:1120px){.boardwrap .board{grid-template-columns:196px minmax(0,1fr) 300px}}
@media (max-width:960px){.boardwrap .board{grid-template-columns:180px minmax(0,1fr)}}
@media (max-width:720px){.boardwrap .board{grid-template-columns:1fr}}

.wrap.scriptwrap{max-width:1160px;width:100%;margin:0 auto;padding:18px 24px 44px;animation:in .35s ease}
.scriptwrap .docgrid{grid-template-columns:230px minmax(0,1fr)}
.scriptwrap .paper{max-width:820px}

/* the launcher inside the batch window: preview tiles + one big button */
.launch{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 24px;
  display:flex;gap:22px;align-items:center;flex-wrap:wrap;box-shadow:0 1px 2px rgba(60,64,67,.08)}
.launch .prev{display:flex;gap:8px;flex:none}

   milestone, a green trail behind the current one. Shown only while a batch
   is in flight; a delivered batch needs no map. */

.rdot{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;

.rnode.done .rdot{background:var(--green);border-color:var(--green)}
.rnode.cur .rdot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 8px var(--accent-tint)}
.rnode.cur.you .rdot{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 8px var(--amber-tint)}
.rnode.up .rdot{background:var(--fill)}
.rnode b{font-size:13.5px;font-weight:600;line-height:1.25}
.rnode.cur b{color:var(--accent-deep)}
.rnode.cur.you b{color:var(--amber-deep)}
.rnode.up b{color:var(--ink-4);font-weight:500}
.rnode i{font-style:normal;font-size:11.5px;color:var(--ink-4);line-height:1.3}
.rnode.cur i{color:var(--ink-3);font-weight:600}
.rseg{flex:1;min-width:30px;height:3px;border-radius:2px;background:var(--line);margin-top:33px}
.rseg.done{background:var(--green)}

.stepx{flex:1;min-width:200px;display:flex;gap:11px;align-items:flex-start}
.stepx .num{width:26px;height:26px;border-radius:50%;background:var(--accent-tint);color:var(--accent-deep);
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.stepx b{display:block;font-size:13px;font-weight:600;line-height:1.35}
.stepx i{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);line-height:1.45}
.warnnote{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 15px;border-radius:14px;

/* review chrome, straight off the internal board: chips, rail pager, the

.bchip.angle{background:var(--accent-tint);border-color:#A8C7FA;color:var(--accent-deep);font-weight:600}
.chiprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.pill.red{color:var(--red);background:var(--red-tint);border:1px solid var(--red-line)}
.railtop{display:flex;align-items:center;gap:6px;padding:0 4px 4px}
.railtop .kicker{flex:1;padding:0 6px}
.railhint{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;color:var(--ink-5);

.ctrlbar{display:flex;align-items:center;gap:11px;padding:0 2px 12px;flex-wrap:wrap}
.ctrlbar .lab{font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.bfoot{position:relative}
.compop{position:absolute;right:0;bottom:52px;width:330px;max-width:82vw;z-index:40;background:var(--surface);
  border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 50px -12px rgba(32,33,36,.3);
  padding:14px 15px;display:flex;flex-direction:column;gap:10px;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.compop .hd{font-size:12px;font-weight:600;color:var(--ink-2)}
.cmt{display:flex;gap:9px;align-items:flex-start}

.cmt .b p{font-size:12px;color:var(--ink-2);line-height:1.5}
.cin{display:flex;gap:7px}
.cin input{flex:1;min-width:0;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);

/* schedule / billing */
.when{width:62px;flex:none;text-align:center;font-size:11.5px;font-weight:700;
  color:var(--ink-3);background:var(--fill);border:1px solid var(--hair);border-radius:999px;padding:7px 0}
.when.now{color:var(--amber);background:var(--amber-tint);border-color:var(--amber-line)}
.inv{font-family:var(--mono);font-size:12px;color:var(--ink-3)}

.toast{position:fixed;right:22px;bottom:22px;z-index:90;display:flex;gap:11px;align-items:flex-start;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 16px;max-width:360px;
  box-shadow:0 18px 50px -12px rgba(32,33,36,.3);animation:in .25s ease}
.toast b{display:block;font-size:12.5px;font-weight:600}
.toast p{font-size:12px;color:var(--ink-3)}
</style>
</head>

/* ---------------------------------------------------------------------------

const g = (a,b) => `linear-gradient(160deg,${a},${b})`;

const BATCHES = [
  { id:'b6', name:'Batch 6', si: stageIdx('concepts'), started:'Aug 18',
    note:'6 video-first concepts against the fall push.',
    wants:['concepts','scripts','talent','videos'],

      { n:'001', t:'The Group Chat Verdict', angle:'The chat already decided', lane:'UGC', dur:30,

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico = (d, stroke='currentColor', w=15) =>

const batch = id => BATCHES.find(b => b.id === id);

/* One comment thread per artifact. The strategist's opener is seeded so the
   thread never looks like a dead letterbox; the client's comments append. */
function comsOf(key){
  if (!S.coms[key]) S.coms[key] = [
    { who:'Krithika', role:'your strategist', ini:'KR', bg:'linear-gradient(135deg,#D01884,#F06CBA)',
      time:'yesterday', text:'Anything you want reworked, say it here and it comes back revised within the day.' }

/* ---------------------------------------------------------------------------
   The window model. Each deliverable lands with the client at one stage - the
   gate - which the internal board pushes when that step is done on our side.

     locked  the studio still holds it        (grey dot, waiting copy)
     you     pushed to the client, act now    (amber dot, review + approve UI)
     done    the client signed it off         (green dot, read-only)
   --------------------------------------------------------------------------- */
const WINDOWS = {
  concepts: { label:'Concepts', gate:'concepts',
    icon:'M4 5h16v11H4zM8 20h8M12 16v4' },
  scripts:  { label:'Scripts',  gate:'scripts',
    icon:'M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h4' },
  talent:   { label:'Talent',   gate:'casting',
    icon:'M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20a6 6 0 0 1 12 0M17 5.5a3 3 0 0 1 0 6M15.5 14.5A6 6 0 0 1 22 20' },
  videos:   { label:'Videos',   gate:'ads',
    icon:'M4 6h12v12H4zM16 10l5-3v10l-5-3' },
  statics:  { label:'Statics',  gate:'ads',
    icon:'M4 4h16v16H4zM4 15l5-5 4 4 3-3 4 4' }
};

function winState(b, w){
  const gi = stageIdx(WINDOWS[w].gate);
  if (b.si > gi) return 'done';
  /* concepts land with the client twice: log lines first, then the write-ups.
     Both read as the Concepts window being in the client's hands. */
  if (w === 'concepts' && (STAGES[b.si].id === 'loglines' || STAGES[b.si].id === 'concepts')) return 'you';
  if (b.si === gi) return 'you';
  return 'locked';
}
/* ---------------------------------------------------------------------------
   The roadmap. Eleven pipeline stages compress into the handful of milestones
   a client actually thinks in, and a milestone only appears if the batch
   requested that deliverable - a statics-only batch has no Talent stop.
   --------------------------------------------------------------------------- */
function milestonesFor(b){
  const M = [
    { l:'Your brief',  ids:['received','review'],      icon:'M6 3h9l4 4v14H6zM14 3v5h5' },
    { l:'Concepts',    ids:['loglines','concepts'],     icon:'M4 5h16v11H4zM8 20h8M12 16v4' },
    b.wants.includes('scripts') ? { l:'Scripts', ids:['scripting','scripts'], icon:'M9 13h6M9 17h4M6 3h9l4 4v14H6z' } : null,
    b.wants.includes('talent')  ? { l:'Talent',  ids:['casting'],             icon:'M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20a6 6 0 0 1 12 0' } : null,
    { l:'In production', ids:['storyboard','building'], icon:'M4 6h12v12H4zM16 10l5-3v10l-5-3' },
    { l:'Your ads',    ids:['ads'],                     icon:'M4 4h16v16H4zM4 15l5-5 4 4 3-3 4 4' },
    { l:'Delivered',   ids:['delivered'],               icon:'M4 12l5 5L20 6' }
  ].filter(Boolean);
  const cur = STAGES[b.si].id;
  let seen = false;
  return M.map(m => {
    const holds = m.ids.includes(cur);
    const state = holds ? 'cur' : (seen ? 'up' : 'done');
    if (holds) seen = true;
    const st = holds ? STAGES[b.si] : null;
    return { ...m, state,
      you: !!(st && st.hand === 'them'),
      meta: holds ? (st.hand === 'them' ? 'needs you' : 'with the studio')
           : state === 'done' ? 'done' : '' };
  });
}
function roadmap(b){
  if (STAGES[b.si].id === 'delivered') return '';
  const ms = milestonesFor(b);
  return `<div class="road">${ms.map((m, i) => `
    ${i ? `<span class="rseg ${m.state === 'done' || m.state === 'cur' ? 'done' : ''}"></span>` : ''}
    <span class="rnode ${m.state}${m.you ? ' you' : ''}">
      <span class="rdot">${m.state === 'done'
        ? ico('M4 12l5 5L20 6','#fff',22)
        : ico(m.icon, m.state === 'cur' ? '#fff' : 'var(--ink-4)', 22)}</span>
      <b>${esc(m.l)}</b>${m.meta ? `<i>${esc(m.meta)}</i>` : '<i>&nbsp;</i>'}
    </span>`).join('')}</div>`;
}

/* Open on whatever needs the client; otherwise the furthest finished window. */
function defaultTab(b){
  const t = b.wants.find(w => winState(b, w) === 'you');
  if (t) return t;
  const done = b.wants.filter(w => winState(b, w) === 'done');
  return done.length ? done[done.length - 1] : b.wants[0];
}

      ${(k.comps || []).map(x => `<div class="bdash"><span>&ndash;</span><p>${x}</p></div>`).join('')}
    </div>
    ${foot}
  </div>`;

  const mock = `<div class="bmock">
    <div class="phone">
      <div class="phead"><span class="av s" style="background:${k.g}">E</span>
        <span><b>ello</b><i>Sponsored</i></span></div>
      <div class="pbody" style="background:${k.g}">
        <b>${esc(k.t)}</b>
        <p>${k.hook}</p>
        <span class="mtag">9:16 &middot; concept mockup</span>
      </div>
    </div>
  </div>`;

  return `<div class="wrap boardwrap">
    ${ctrl}
    <div class="board">${rail}${doc}${mock}</div>
  </div>`;
}

/* The FULL scripts view - the internal's doc page: rail | the paper, with the
   control bar above it. The page scrolls like a doc should. */
function vScripts(){
  const b = batch(S.batch);
  const ws = winState(b, 'scripts');
  const list = b.scripts || [];
  const i = Math.min(S.sIdx[b.id] || 0, list.length - 1);
  const cur = list[i], key = b.id + 's' + cur.n, ok = !!S.approved[key];
  const okCount = list.filter(x => S.approved[b.id + 's' + x.n]).length;
  const ro = ws === 'done';
  chrome(`${b.name} · Scripts`, ro ? 'Approved' : `${okCount} of ${list.length} approved`, true);

  const rail = `<div>
    <span class="kicker" style="padding:0 12px 8px;display:block">Scripts &middot; ${list.length}</span>
    ${list.map((x, ix) => `
      <button class="dritem ${ix === i ? 'on' : ''}" data-sidx="${ix}">
        <span>${esc(x.n)}_${esc(x.t)}</span>
        ${ro || S.approved[b.id + 's' + x.n] ? ico('M4 12l5 5L20 6','var(--green)',12) : ''}
      </button>`).join('')}
  </div>`;

  const dec = !!S.declined[key];
  const coms = comsOf(key);
  const ctrl = ro
    ? `<div class="donebar" style="margin:0 0 14px">${ico('M4 12l5 5L20 6','var(--green)',14)} You approved these scripts.</div>`
    : `<div class="card" style="display:flex;align-items:center;gap:11px;padding:10px 14px;flex-wrap:wrap;margin-bottom:14px;position:relative">
        <span class="pill ${verdictOf(key).cls}">${verdictOf(key).label}</span>
        <span style="font-size:12px;color:var(--ink-3);flex:1;min-width:140px">${esc(STAGES[stageIdx('scripts')].blurb)}</span>
        <button class="btn sm ${ok ? 'ghost' : 'primary'}" data-approve="${key}">${ico('M4 12l5 5L20 6', ok ? 'var(--green)' : '#fff', 13)} ${ok ? 'Approved' : 'Approve script'}</button>
        <button class="btn sm ghost" data-decline="${key}" ${dec ? 'style="border-color:var(--red-line);color:var(--red)"' : ''}>${dec ? 'Sent back &#10005;' : 'Send back'}</button>
        <button class="btn sm ghost" data-comtoggle>${ico('M4 5h16v11H7l-3 3z','currentColor',13)} Comments${coms.length > 1 ? ' &middot; ' + (coms.length - 1) : ''}</button>
        <button class="btn sm primary" data-send="${b.id}" data-kind="scripts" ${okCount ? '' : 'disabled'}>Send to the studio</button>
        ${S.comOpen ? `<div class="compop" style="bottom:auto;top:52px">
          <span class="hd">Comments &middot; ${esc(cur.n)} ${esc(cur.t)}</span>
          ${coms.map(c => `<div class="cmt">
            <span class="av s" style="background:${c.bg}">${esc(c.ini)}</span>
            <span class="b"><span class="who"><b>${esc(c.who)}</b><time>${esc(c.role ? c.role + ' · ' : '')}${esc(c.time)}</time></span>
            <p>${esc(c.text)}</p></span>
          </div>`).join('')}
          <div class="cin">
            <input type="text" data-cominput placeholder="Suggest the edit&hellip;">
            <button class="btn sm primary" data-compost="${key}">Comment</button>
          </div>
        </div>` : ''}
      </div>`;

  const hooks = (cur.hooks || []).map((h, ix) => `
    <p class="hooklab" style="margin-top:${ix ? 18 : 0}px">Hook ${ix + 1}:</p>
    <p class="hooklab">Opening Line:</p>
    <div class="pline">${h.line}</div>
    <p class="dirline">[${h.dir}]</p>`).join('');

  const body = (cur.script || []).map(x => `
    <div style="margin-bottom:14px">
      <div class="pline">${x.vo}</div>
      ${x.dir ? `<p class="dirline">[${x.dir}]</p>` : ''}
    </div>`).join('');

  return `<div class="wrap scriptwrap">
    ${ctrl}
    <div class="docgrid">
      ${rail}
      <div>
        <div class="paper">
          <div style="font-size:24px;font-weight:700;letter-spacing:-.012em;margin-bottom:6px">${esc(CLIENT.name)} Scripts</div>
          <p style="font-size:12px;color:var(--ink-3);margin-bottom:16px">${esc(b.name)} &middot; prepared by your strategist</p>
          <p style="font-size:11.5px;line-height:1.65;color:var(--ink-3);font-style:italic;margin-bottom:20px">
            We assume that you have proper substantiation for any claims about your products and services, and that you will
            add any disclaimers required for full legal compliance, including, without limitation, compliance with the FTC&rsquo;s
            endorsement guidelines and any other applicable advertising related disclosures.</p>
          <div style="height:1px;background:var(--line);margin-bottom:24px"></div>
          <div style="font-size:19px;font-weight:700;color:var(--accent);margin-bottom:4px">${esc(cur.n)} &middot; ${esc(cur.t)}</div>
          <p style="font-size:12px;color:var(--ink-3);margin-bottom:22px">${esc(cur.draft || 'first draft')}</p>
          ${hooks}
          <p class="hooklab" style="margin-top:26px;margin-bottom:10px">Script:</p>
          ${body}
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- router ---------- */
const URL_VIEWS = new Set(['home','batches','batch','concepts','scripts','library','schedule','billing']);
function syncUrl(){
  if (!URL_VIEWS.has(S.view)) return;
  const q = new URLSearchParams();
  q.set('view', S.view);
  if (S.view === 'batch'){ q.set('b', S.batch); const t = S.tab[S.batch]; if (t) q.set('t', t); }
  if (S.view === 'concepts' || S.view === 'scripts') q.set('b', S.batch);
  try { history.replaceState(null, '', location.pathname + '?' + q.toString()); } catch(e){}
}
function restoreFromUrl(){
  let p; try { p = new URLSearchParams(location.search); } catch(e){ return; }
  const b = p.get('b');
  if (b && batch(b)) S.batch = b;
  const t = p.get('t');
  if (t && WINDOWS[t]) S.tab[S.batch] = t;
  const v = p.get('view');
  if (v && URL_VIEWS.has(v)) S.view = v;
}
function go(v){ S.view = v; render(); }
function render(){
  renderNav();
  const v = S.view;
  let html;
  if (v === 'home') html = vHome();
  else if (v === 'batches') html = vBatches();
  else if (v === 'batch') html = vBatch();
  else if (v === 'concepts') html = vConcepts();
  else if (v === 'scripts') html = vScripts();
  else if (v === 'library') html = vLibrary();
  else if (v === 'schedule') html = vSchedule();
  else if (v === 'billing') html = vBilling();
  else html = vHome();
  $('#view').innerHTML = html;
  $('.body').scrollTop = 0;
  syncUrl();
  fitDoc();
}

/* The internal's slide auto-fit: try the full type scale, and only step down
   when the rendered slide genuinely overflows its pane. */
const FIT_STEPS = ['', 'mid', 'tight', 'xtight'];
function fitDoc(){
  const el = $('.bscroll');
  if (!el) return;
  for (let i = 0; i < FIT_STEPS.length; i++){
    el.className = 'bscroll' + (FIT_STEPS[i] ? ' ' + FIT_STEPS[i] : '');
    if (el.scrollHeight <= el.clientHeight + 1) return;
  }
}

document.addEventListener('click', e => {
  const t = e.target;
  const go_ = t.closest('[data-go]');
  if (go_) { go(go_.dataset.go); return; }
  const open = t.closest('[data-open]');
  if (open) { S.batch = open.dataset.open; go('batch'); return; }
  const gv = t.closest('[data-goview]');
  if (gv) { go(gv.dataset.goview); return; }
  const tb = t.closest('[data-tab]');
  if (tb) { S.tab[S.batch] = tb.dataset.tab; render(); return; }
  const ap = t.closest('[data-approve]');
  if (ap) {
    const k = ap.dataset.approve;
    S.approved[k] = !S.approved[k];
    if (S.approved[k]) S.declined[k] = false;
    render(); return;
  }
  const pk = t.closest('[data-pick]');
  if (pk) { const k = pk.dataset.pick; S.picks[k] = !S.picks[k]; render(); return; }
  const ci = t.closest('[data-cidx]');
  if (ci && !ci.disabled) { S.cIdx[S.batch] = +ci.dataset.cidx; S.comOpen = false; render(); return; }
  const sx = t.closest('[data-sidx]');
  if (sx) { S.sIdx[S.batch] = +sx.dataset.sidx; S.comOpen = false; render(); return; }
  const cm = t.closest('[data-comment]');
  if (cm) { const k = cm.dataset.comment; S.notesOpen[k] = !S.notesOpen[k]; render(); return; }
  const dc = t.closest('[data-decline]');
  if (dc) {
    const k = dc.dataset.decline;
    S.declined[k] = !S.declined[k];
    if (S.declined[k]) { S.approved[k] = false; S.comOpen = true; }  /* say why */
    render(); return;
  }
  if (t.closest('[data-comtoggle]')) { S.comOpen = !S.comOpen; render(); return; }
  const cp = t.closest('[data-compost]');
  if (cp) {
    const inp = document.querySelector('[data-cominput]');
    const txt = (inp && inp.value || '').trim();
    if (txt) {
      comsOf(cp.dataset.compost).push({ who:'You', ini:'CB',
        bg:'linear-gradient(135deg,#0F7B6C,#2BB3A3)', time:'just now', text:txt });
      render();
    }
    return;
  }
  const sd = t.closest('[data-send]');
  if (sd && !sd.disabled) {
    /* The handoff rule, honoured even in the demo: the CLIENT's acceptance is
       what advances the batch. Each sign-off moves it to the next studio step. */
    const b = batch(sd.dataset.send), kind = sd.dataset.kind;
    if (kind === 'concepts'){ b.si = stageIdx('scripting');
      toast('Sent to the studio', 'Approved concepts went to the copywriters. Scripts land next.'); }
    else if (kind === 'scripts'){ b.si = stageIdx('casting');
      toast('Sent to the studio', 'Scripts locked. The casting shortlist is next.'); }
    else if (kind === 'talent'){ b.si = stageIdx('storyboard');
      toast('Creators confirmed', 'The studio takes it from here — you will see finished ads next.'); }
    render(); return;
  }
  const ts = t.closest('[data-toast]');
  if (ts) { const [a, b] = ts.dataset.toast.split('|'); toast(a, b || ''); return; }
  if (t.closest('#back')) {
    go(S.view === 'concepts' || S.view === 'scripts' ? 'batch'
       : S.view === 'batch' ? 'batches' : 'home');
    return;
  }
});
document.addEventListener('keydown', e => {
  if (S.view !== 'concepts') return;
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const b = batch(S.batch), n = (b.concepts || []).length;
  const i = Math.min(S.cIdx[b.id] || 0, n - 1);
  if (e.key === 'ArrowRight' && i < n - 1) { S.cIdx[b.id] = i + 1; render(); }
  else if (e.key === 'ArrowLeft' && i > 0) { S.cIdx[b.id] = i - 1; render(); }
  else if (/^[1-9]$/.test(e.key) && +e.key <= n) { S.cIdx[b.id] = +e.key - 1; render(); }
});
document.addEventListener('input', e => {
  const n = e.target.closest('[data-note]');
  if (n) S.notes[n.dataset.note] = n.value;
});

restoreFromUrl();
render();
</script>
