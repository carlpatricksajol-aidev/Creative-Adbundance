<meta charset="utf-8">
<title>Meeting Notetaker</title>
<style>
  body{width:320px;margin:0;padding:14px;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#0f0f12;color:#fff}
  @media (prefers-color-scheme:light){body{background:#fff;color:#14141c}}
  h1{font-size:14px;margin:0 0 10px;font-weight:650}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.55;margin:9px 0 3px;font-weight:650}
  input,select{width:100%;box-sizing:border-box;font:inherit;font-size:13px;padding:6px 9px;border-radius:7px;border:1px solid rgba(128,128,128,.35);background:transparent;color:inherit}
  button{width:100%;font:inherit;font-size:13.5px;font-weight:650;padding:9px;border-radius:8px;border:0;margin-top:12px;cursor:pointer;background:#6B47FF;color:#fff}
  button.stop{background:#e03131}
  .row{display:flex;gap:8px;align-items:center;margin-top:9px;font-size:12.5px;opacity:.75}
  .row input[type=checkbox]{width:auto}
  .status{margin-top:11px;padding:9px 11px;border-radius:8px;background:rgba(224,49,49,.12);border:1px solid rgba(224,49,49,.4);font-size:12.5px;display:none}
  .status.on{display:block}
  .warn{margin-top:10px;font-size:11.5px;opacity:.6;line-height:1.4}
  .err{color:#f87171;font-size:12px;margin-top:8px}
  details{margin-top:12px;font-size:12px;opacity:.8}
  summary{cursor:pointer}
</style>

<h1>Meeting Notetaker</h1>

<div id="idle">
  <label>Client / brand</label>
  <input id="brand" placeholder="ARMRA" list="brands">
  <label>What is this call</label>
  <select id="type">
    <option value="client-review">Client review</option>
    <option value="kickoff">Kickoff</option>
    <option value="strategy">Strategy</option>
    <option value="creative-review">Creative review</option>
    <option value="internal-standup">Internal standup</option>
    <option value="sales">Sales</option>
    <option value="other">Other</option>
  </select>
  <label>Who is on the client side</label>
  <input id="clients" placeholder="Dana, Marcus">
  <label>Who is on our side</label>
  <input id="internal" placeholder="Eric, Kyle, Carl">
  <div class="row"><input type="checkbox" id="mic" checked><span>include my microphone</span></div>
  <button id="start">Start recording</button>
  <p class="warn">Say out loud that an AI notetaker is on before you start. Recording without telling people is illegal in a lot of places, and it is the kind of thing a client remembers.</p>
</div>

<div class="status" id="rec">
  <b>Recording</b> — <span id="elapsed">00:00</span><br>
  <span id="recTitle" style="opacity:.7"></span>
  <button class="stop" id="stop">Stop and file it</button>
</div>

<div class="err" id="err"></div>

<details>
  <summary>Server settings</summary>
  <label>Server URL</label>
  <input id="server" placeholder="https://meetings.srv1486031.hstgr.cloud">
  <label>Access token</label>
  <input id="token" type="password" placeholder="MEETING_TOKEN">
  <label>Your name</label>
  <input id="me" placeholder="Carl">
  <button id="save" style="background:#444">Save settings</button>
</details>

<datalist id="brands"></datalist>
<script src="popup.js" type="module"></script>
