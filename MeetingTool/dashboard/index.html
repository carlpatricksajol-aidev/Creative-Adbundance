<title>AI Meeting Tool — Review</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Tokens mirror FigmaComments/dashboard so the two internal tools look like one system. */
:root{
  --bg:#0b0b0f; --surface:#141414; --surface-2:#181818; --surface-3:#1b1b26;
  --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.12);
  --text:#fff; --text-2:rgba(255,255,255,.62); --text-3:rgba(255,255,255,.4);
  --accent:#6B47FF; --accent-wash:rgba(107,71,255,.14);
  --ok:#4ade80; --warn:#fbbf24; --danger:#f87171;
  --shadow:0 10px 28px rgba(0,0,0,.5);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f4f4f7; --surface:#fff; --surface-2:#f6f6f9; --surface-3:#eef0f6;
  --border:rgba(0,0,0,.09); --border-strong:rgba(0,0,0,.16);
  --text:#14141c; --text-2:rgba(20,20,28,.66); --text-3:rgba(20,20,28,.5);
  --accent-wash:rgba(107,71,255,.1);
  --ok:#15803d; --warn:#b45309; --danger:#b91c1c;
  --shadow:0 10px 28px rgba(20,20,40,.12);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
a{color:var(--accent)}
header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em}
.wrap{display:grid;grid-template-columns:300px 1fr;gap:0;min-height:calc(100vh - 61px)}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
aside{border-right:1px solid var(--border);padding:14px;overflow-y:auto;max-height:calc(100vh - 61px)}
main{padding:22px;max-width:900px}
.m{padding:10px 12px;border-radius:9px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.m:hover{background:var(--surface-2)}
.m.on{background:var(--accent-wash);border-color:var(--border-strong)}
.m b{display:block;font-weight:600;font-size:14px;margin-bottom:2px}
.muted{color:var(--text-3);font-size:12.5px}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid var(--border-strong)}
.pill.auto{color:var(--ok)} .pill.review{color:var(--warn)} .pill.blocked{color:var(--danger)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 6px;font-size:15px;font-weight:620;letter-spacing:-.01em}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.type{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:650}
blockquote{margin:9px 0 0;padding:8px 12px;border-left:2px solid var(--accent);background:var(--surface-2);border-radius:0 7px 7px 0;font-size:13.5px;color:var(--text-2)}
blockquote cite{display:block;margin-top:4px;font-style:normal;font-size:11.5px;color:var(--text-3)}
.diff{margin:10px 0 0;font-size:13px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.diff div{padding:7px 11px;white-space:pre-wrap;word-break:break-word}
.diff .old{color:var(--text-3);text-decoration:line-through;border-bottom:1px solid var(--border)}
.diff .new{color:var(--text)}
.diff .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);display:block;text-decoration:none;margin-bottom:2px}
button{font:inherit;font-size:13px;font-weight:600;padding:6px 13px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;margin-top:11px;align-items:center;flex-wrap:wrap}
input{font:inherit;padding:7px 11px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);min-width:260px}
.sec{margin:26px 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);font-weight:700}
.note{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:11px 13px;font-size:13.5px;color:var(--text-2);margin-bottom:14px}
.done{color:var(--ok);font-size:12.5px;font-weight:600}
.err{color:var(--danger);font-size:12.5px}
</style>

<header>
  <h1>AI Meeting Tool</h1>
  <span class="muted" id="sub">review what the meeting proposes to change</span>
  <span style="flex:1"></span>
  <a id="connectLink" href="/connect" style="font-size:12.5px">connect a teammate</a>
  <input id="tok" type="password" placeholder="access token from .env" autocomplete="off" aria-label="Access token">
  <button onclick="saveTok()">Save</button>
</header>

<div class="wrap">
  <aside id="list"><p class="muted">enter the token to load meetings</p></aside>
  <main id="detail"></main>
</div>

<script>
const $ = (s) => document.querySelector(s);
let TOKEN = localStorage.getItem("meetingToken") || "";
let current = null;           // { meeting, changeset, changesetId, applied }
let appliedIds = new Set();   // item ids already written or rejected

$("#tok").value = TOKEN;

function saveTok() {
  TOKEN = $("#tok").value.trim();
  localStorage.setItem("meetingToken", TOKEN);
  // The connect page is gated by the same token; carry it so the link works when shared.
  $("#connectLink").href = "/connect?t=" + encodeURIComponent(TOKEN);
  loadList();
}
if (TOKEN) $("#connectLink").href = "/connect?t=" + encodeURIComponent(TOKEN);

// Typing a token and pressing Enter is what everyone actually does. Requiring a separate click
// on Save made the page look broken to someone who had pasted the right token.
$("#tok").addEventListener("keydown", (e) => { if (e.key === "Enter") saveTok(); });
// Paste-and-go: a pasted token is almost always the whole intent.
$("#tok").addEventListener("paste", () => setTimeout(saveTok, 0));

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { authorization: "Bearer " + TOKEN, "content-type": "application/json", ...(opts.headers || {}) },
  });
  if (!res.ok) {
    // 401 is the common case and "401" alone tells nobody what to do about it.
    if (res.status === 401) {
      throw new Error(TOKEN
        ? "That token was rejected. It must match MEETING_TOKEN in MeetingTool/.env — and the server has to be restarted after you change that file."
        : "Enter the access token from MeetingTool/.env.");
    }
    throw new Error((await res.json().catch(() => ({}))).error || `server returned ${res.status}`);
  }
  return res.json();
}

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const when = (d) => (d ? new Date(d).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "");

async function loadList() {
  try {
    const rows = await api("/api/meetings");
    $("#list").innerHTML = rows.map((m) => {
      const c = m.changeset;
      // A meeting that is `ready` with no changeset is not "done" in any useful sense — it had no
      // transcript. Saying "ready" made a third of the list look processed when nothing was.
      const counts = c
        ? [c.auto_count && `<span class="pill auto">${c.auto_count} recorded</span>`,
           c.review_count && `<span class="pill review">${c.review_count} review</span>`,
           c.blocked_count && `<span class="pill blocked">${c.blocked_count} manual</span>`].filter(Boolean).join(" ")
        : m.status === "ready" ? `<span class="pill blocked">no transcript</span>`
        : m.status === "failed" ? `<span class="pill blocked">failed</span>`
        : `<span class="muted">${esc(m.status)}</span>`;
      return `<div class="m" data-id="${m.id}" onclick="open_('${m.id}')">
        <b>${esc(m.title || "Untitled meeting")}</b>
        <div class="muted">${esc(m.brand || "no brand")} · ${when(m.started_at)}</div>
        <div style="margin-top:5px">${counts}</div></div>`;
    }).join("") || '<p class="muted">no meetings yet</p>';
    if (!current && rows[0]) open_(rows[0].id);
  } catch (e) { $("#list").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

async function open_(id) {
  document.querySelectorAll(".m").forEach((el) => el.classList.toggle("on", el.dataset.id === id));
  $("#detail").innerHTML = '<p class="muted">loading…</p>';
  try {
    current = await api("/api/meetings/" + id);
    appliedIds = new Set((current.applied || []).map((a) => a.item_id));
    render();
  } catch (e) { $("#detail").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

function itemCard(it) {
  const done = appliedIds.has(it.id);
  const st = (current.applied || []).find((a) => a.item_id === it.id);
  const w = it.write;

  const ev = (it.evidence || []).map((e) =>
    `<blockquote>“${esc(e.quote)}”<cite>${esc(e.speaker || "unknown")}${e.role ? ` · ${esc(e.role)}` : ""}${
      e.atSec != null ? ` · ${String(Math.floor(e.atSec / 60)).padStart(2, "0")}:${String(Math.round(e.atSec % 60)).padStart(2, "0")}` : ""
    }</cite></blockquote>`).join("");

  // The old -> new diff is the whole point of the review gate: you are approving a replacement,
  // so you must see what is being replaced.
  const diff = w && w.target === "supabase.brand_brain"
    ? `<div class="diff">${w.previousValue
        ? `<div class="old"><span class="lbl">${esc(w.field)} — now</span>${esc(w.previousValue)}</div>` : ""}
        <div class="new"><span class="lbl">${esc(w.field)} — ${w.previousValue ? "proposed" : "currently empty, proposed"}</span>${esc(w.value)}</div></div>`
    : w ? `<div class="diff"><div class="new"><span class="lbl">${esc(w.target)} · ${esc(w.op)}</span>${esc(
        typeof w.value === "string" ? w.value : [w.value.title, w.value.detail, w.value.assignee && `owner: ${w.value.assignee}`, w.value.dueDate && `due: ${w.value.dueDate}`].filter(Boolean).join("\n"))}</div></div>`
    : "";

  const actions = done
    ? `<div class="row"><span class="${st?.status === "failed" ? "err" : "done"}">${esc(st?.status || "applied")}${
        st?.error ? ` — ${esc(st.error)}` : ""}${st?.result?.url ? ` · <a href="${esc(st.result.url)}" target="_blank" rel="noopener">open</a>` : ""}</span></div>`
    : it.tier === "blocked"
    ? `<div class="row"><span class="muted">${esc(it.blockedReason || "a person needs to handle this")} — not writable from here</span>
       <button onclick="reject(['${it.id}'])">Dismiss</button></div>`
    : `<div class="row"><button class="primary" onclick="apply(['${it.id}'])">Apply</button>
       <button onclick="reject(['${it.id}'])">Reject</button>
       <span class="muted">confidence ${Number(it.confidence).toFixed(2)}${it.blockedReason ? ` · ${esc(it.blockedReason)}` : ""}</span></div>`;

  return `<div class="card">
    <div class="meta"><span class="type">${esc(it.type.replace(/_/g, " "))}</span>
      <span class="pill ${it.tier}">${it.tier}</span>
      ${it.supersededBy ? '<span class="pill blocked">reversed later</span>' : ""}
      ${it.supersedes?.length ? '<span class="pill review">supersedes an earlier point</span>' : ""}</div>
    <h3>${esc(it.title)}</h3>
    ${it.detail ? `<div class="muted">${esc(it.detail)}</div>` : ""}
    ${diff}${ev}${actions}</div>`;
}

function render() {
  const { meeting, changeset } = current;

  // No changeset: either the meeting had no transcript (so nothing could be verified or
  // extracted), or it failed. Show what WAS captured and say plainly what to do about it —
  // "No changeset yet" told the reader nothing and looked like a bug.
  if (!changeset) {
    const gem = (current.notes || []).filter((n) => n.kind === "gemini_notes");
    const failed = meeting.status === "failed";
    const empty = /NO SPEECH/.test(gem[0]?.detail || "");

    $("#detail").innerHTML = `
      <h2 style="margin:0 0 4px;font-size:20px;letter-spacing:-.02em">${esc(meeting.title || "Untitled meeting")}</h2>
      <p class="muted" style="margin:0 0 14px">${when(meeting.started_at)} ·
        ${(meeting.participants || []).map((p) => esc(p.name)).join(", ") || "no participants recorded"}</p>

      ${failed ? `<div class="note" style="border-color:var(--danger)">
          <b>This meeting failed to process.</b><br>${esc(meeting.error || "no error recorded")}
        </div>`
      : empty ? `<div class="note">
          <b>Nobody spoke.</b> The meeting was opened but the transcript is empty, so there was
          nothing to extract. Nothing is wrong.
        </div>`
      : `<div class="note" style="border-color:var(--warn)">
          <b>No transcript, so nothing could be extracted.</b><br>
          This meeting had Gemini&rsquo;s <em>&ldquo;Take notes for me&rdquo;</em> switched on, but
          <b>not transcription</b>. Without a transcript there is nothing to quote, and this tool
          will not record an item it cannot attach to something a person actually said.<br><br>
          <b>Fix it for every future occurrence:</b> the meeting organiser opens the event in
          Google&nbsp;Calendar &rarr; <b>Meeting records</b> &rarr; tick <b>Transcribe the meeting</b>.
          On a recurring event that applies to the whole series. Past meetings cannot be
          recovered &mdash; Google does not backfill a transcript that was never made.
        </div>`}

      ${gem.length ? `<div class="sec">What Google recorded · unverified</div>
        ${gem.map((n) => `<div class="card">
          <div class="meta"><span class="type">gemini notes</span>
            <span class="pill blocked">unverified</span></div>
          <div style="white-space:pre-wrap;font-size:14.5px;color:var(--text-2)">${esc(n.detail || "")}</div>
        </div>`).join("")}` : ""}`;
    return;
  }

  const byTier = (t) => changeset.items.filter((i) => i.tier === t && !appliedIds.has(i.id));
  const pending = byTier("review");
  const section = (title, items) => items.length
    ? `<div class="sec">${title} · ${items.length}</div>${items.map(itemCard).join("")}` : "";

  $("#detail").innerHTML = `
    <h2 style="margin:0 0 4px;font-size:20px;letter-spacing:-.02em">${esc(meeting.title || "Untitled meeting")}</h2>
    <p class="muted" style="margin:0 0 14px">${esc(meeting.brand || "no brand resolved")} · ${when(meeting.started_at)} ·
      ${changeset.transcript.wordCount} words · ${esc(changeset.model || "")}
      ${meeting.audio_path ? ` · <a href="#" onclick="audio(event)">listen</a>` : ""}</p>
    <div class="note"><b>${esc(changeset.summary.headline)}</b><br>${esc(changeset.summary.narrative)}</div>
    ${!meeting.brand_record_id ? '<div class="note" style="border-color:var(--warn)">No Brand Brain row matched this meeting, so nothing was written to a client record &mdash; brand facts were recorded as notes instead. Add the spoken name to that client&rsquo;s <code>brand_brain.aliases</code> (pipe-delimited) and re-ingest to attribute them. That also improves ad generation.</div>' : ""}
    ${pending.length ? `<div class="row"><button class="primary" onclick="apply(${JSON.stringify(pending.map((i) => i.id)).replace(/"/g, "&quot;")})">Apply all ${pending.length} reviewed</button></div>` : ""}
    ${section("Needs your review", pending)}
    ${section("Needs a person", byTier("blocked"))}
    ${section("Applied automatically", changeset.items.filter((i) => i.tier === "auto"))}
    ${changeset.dropped?.length ? `<div class="sec">Discarded · ${changeset.dropped.length}</div><div class="note">${
      changeset.dropped.map((d) => `${esc(d.title)} <span class="muted">— ${esc(d.reason)}</span>`).join("<br>")
    }</div>` : ""}`;
}

async function apply(ids) {
  document.querySelectorAll("button").forEach((b) => (b.disabled = true));
  try {
    const r = await api(`/api/changesets/${current.changesetId}/apply`, { method: "POST", body: JSON.stringify({ itemIds: ids }) });
    if (r.failed?.length) alert("Some writes failed:\n" + r.failed.map((f) => `${f.id}: ${f.error}`).join("\n"));
    await open_(current.meeting.id);
    loadList();
  } catch (e) { alert(e.message); document.querySelectorAll("button").forEach((b) => (b.disabled = false)); }
}

async function reject(ids) {
  await api(`/api/changesets/${current.changesetId}/reject`, { method: "POST", body: JSON.stringify({ itemIds: ids }) });
  await open_(current.meeting.id);
}

async function audio(e) {
  e.preventDefault();
  const { url } = await api(`/api/meetings/${current.meeting.id}/audio`);
  window.open(url, "_blank", "noopener");
}

if (TOKEN) loadList();
</script>
