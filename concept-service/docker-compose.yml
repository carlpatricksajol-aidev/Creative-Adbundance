# Mirrors the videoeditor service's routing, which already works on this box:
# traefik discovers the container by label and terminates TLS with letsencrypt.
#
# This is the PRODUCTION file. A laptop run adds docker-compose.local.yml on
# top of it by name. Never rename that file to docker-compose.override.yml:
# the deploy here is `docker compose up -d --build` in this directory, Compose
# picks up an override file automatically, and a committed override would
# follow a git pull into production.
#
# `env_file: .env` below is not optional. With no .env on disk Compose aborts
# before it builds anything, so the first step on any box is
# `cp .env.example .env`.
services:
  concept-service:
    build: .
    container_name: concept-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8900"
      DATA_DIR: /data
      SKILL_DIR: /srv/repo/.claude/skills/ad-concept-generator
      # the script writer and the shoot package, read the same way: from the
      # repo checkout, so a `git pull` changes their craft with no deploy
      SCRIPT_SKILL_DIR: /srv/repo/.claude/skills/ad-script-writer
      STORY_SKILL_DIR: /srv/repo/.claude/skills/batch-shoot-package
      RESEARCH_AGENT_URL: http://host.docker.internal:3210
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      # the runner's job queue, so onboarding can ask for a Drive read. Same
      # volume the adbundance-os hud and runner already share.
      - adbundance-os_vault:/vault
      # the skill is read from the repo checkout, so `git pull` updates the craft.
      # Relative to this file, so it resolves to the checkout that contains it:
      # on the VPS that is /root/Creative-Adbundance, the same path as before,
      # and on a laptop it is whatever the clone is called.
      - ..:/srv/repo:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.concepts.rule: "Host(`concepts.srv1486031.hstgr.cloud`)"
      traefik.http.routers.concepts.entrypoints: "websecure"
      traefik.http.routers.concepts.tls.certresolver: "letsencrypt"
      traefik.http.services.concepts.loadbalancer.server.port: "8900"

volumes:
  # created by the adbundance-os stack; joined here, never owned here
  adbundance-os_vault:
    external: true
